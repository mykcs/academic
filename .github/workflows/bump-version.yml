name: Validate Main and Bump Version Tag

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Prevent concurrent runs from racing on tag creation/push.
concurrency:
  group: bump-version-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate-and-bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify atomic release contract locally
        run: python3 scripts/test-release-tags.py

      - name: Validate manifest before publishing a tag
        run: |
          set -euo pipefail
          python3 scripts/generate-manifest.py --check

      - name: Pre-bump guard (no destructive uncommitted deletions)
        id: preflight
        run: |
          set -euo pipefail
          if git status --porcelain | grep -E '^( D|D ) ' >/dev/null 2>&1; then
            echo "::error::Uncommitted destructive deletions detected in working tree."
            echo "::error::Resolve them (commit or restore) before bumping the version tag."
            git status --short | grep -E '^( D|D ) ' || true
            exit 1
          fi
          echo "preflight=ok" >> "$GITHUB_OUTPUT"

      - name: Get latest v1.x.y tag
        id: latest_tag
        if: steps.preflight.outputs.preflight == 'ok'
        run: |
          set -euo pipefail
          git fetch --tags --force
          LATEST=$(git tag -l 'v1.*' --sort=-version:refname \
            | grep -E '^v1\.[0-9]+\.[0-9]+$' \
            | head -1)
          LATEST="${LATEST:-v1.0.-1}"
          V1_TIP=$(git ls-remote --refs origin refs/tags/v1 | awk '{print $1}')
          echo "v1_tip=$V1_TIP" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Found latest tag: $LATEST"

      - name: Bump version
        id: bump
        if: steps.preflight.outputs.preflight == 'ok'
        run: |
          set -euo pipefail
          CURRENT=${{ steps.latest_tag.outputs.latest }}
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3 | cut -d- -f1)
          PATCH=$((PATCH + 1))
          NEW_TAG="${MAJOR}.${MINOR}.${PATCH}"
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "old_tag=$CURRENT" >> "$GITHUB_OUTPUT"

      - name: Publish version and v1 alias atomically
        if: steps.bump.outputs.new_tag != steps.bump.outputs.old_tag
        env:
          NEW_TAG: ${{ steps.bump.outputs.new_tag }}
          EXPECTED_V1: ${{ steps.latest_tag.outputs.v1_tip }}
        run: |
          set -euo pipefail
          # Both refs change together. A concurrent alias update or version-tag
          # collision rejects the whole transaction and preserves the other ref.
          # jsDelivr may cache @v1; use immutable v1.x.y for reproducibility.
          git push --atomic \
            --force-with-lease="refs/tags/v1:${EXPECTED_V1}" \
            --force-with-lease="refs/tags/${NEW_TAG}:" \
            origin "HEAD:refs/tags/${NEW_TAG}" "HEAD:refs/tags/v1"
