name: Bump Version Tag

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Prevent concurrent runs from racing on tag creation/push.
# Group key uses ref so main and feature branches don't block each other.
concurrency:
  group: bump-version-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pre-bump guard (no destructive uncommitted deletions)
        id: preflight
        run: |
          set -euo pipefail
          # Fail if there are uncommitted deletions of tracked files.
          # This prevents tagging a broken state where files were removed locally
          # but not yet committed.
          if git status --porcelain | grep -E '^( D|D ) ' >/dev/null 2>&1; then
            echo "::error::Uncommitted destructive deletions detected in working tree."
            echo "::error::Resolve them (commit or restore) before bumping the version tag."
            git status --short | grep -E '^( D|D ) ' || true
            exit 1
          fi
          echo "preflight=ok" >> "$GITHUB_OUTPUT"

      - name: Get latest v1.x.y tag
        id: latest_tag
        if: steps.preflight.outputs.preflight == 'ok'
        run: |
          set -euo pipefail
          git fetch --tags --force
          # Use git tag -l (lists actual tag refs) instead of git describe
          # (returns nearest reachable tag; can fail on shallow clone or
          # detached HEAD, and returns "vX.Y.Z-N-gHHHH" suffix when HEAD is
          # ahead of the tag, breaking version parsing downstream).
          # Filter to strict vMAJOR.MINOR.PATCH (no pre-release / suffix).
          LATEST=$(git tag -l 'v1.*' --sort=-version:refname \
            | grep -E '^v1\.[0-9]+\.[0-9]+$' \
            | head -1)
          # Fallback only when no v1.x.y tag exists at all.
          # Use v1.0.-1 so the next patch bump produces v1.0.0 (the bootstrap tag).
          LATEST="${LATEST:-v1.0.-1}"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Found latest tag: $LATEST"

      - name: Bump version
        id: bump
        if: steps.preflight.outputs.preflight == 'ok'
        run: |
          set -euo pipefail
          CURRENT=${{ steps.latest_tag.outputs.latest }}
          # Extract major.minor.patch
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3 | cut -d- -f1)
          # Increment patch
          PATCH=$((PATCH + 1))
          NEW_TAG="${MAJOR}.${MINOR}.${PATCH}"
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "old_tag=$CURRENT" >> $GITHUB_OUTPUT

      - name: Create and push tag
        if: steps.bump.outputs.new_tag != steps.bump.outputs.old_tag
        run: |
          git tag "${{ steps.bump.outputs.new_tag }}"
          git push origin "${{ steps.bump.outputs.new_tag }}"

      - name: Update v1 tag to latest
        if: steps.bump.outputs.new_tag != steps.bump.outputs.old_tag
        run: |
          # Move v1 to point to the newly created tag.
          # NOTE: jsDelivr caches the 301 redirect for @v1; force-push takes
          # 30s-5min to propagate. Consumers should pin explicit @v1.x.y tags
          # rather than relying on the moving @v1 tag.
          git tag -d v1
          git push origin :refs/tags/v1
          git tag v1 "${{ steps.bump.outputs.new_tag }}"
          git push origin v1
