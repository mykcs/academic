name: Validate Manifest

# PR gate for scripts/generate-manifest.py.
# Main-branch validation runs inside bump-version.yml so one main push does not
# start two separate GitHub-hosted runners for the same repository invariant.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded validation cancels within one PR. Manual audits remain independent
# of PR validation and of the separate main version-tag release workflow.
concurrency:
  group: manifest-validation-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify atomic release contract locally
        run: python3 scripts/test-release-tags.py

      - name: Validate manifest matches working tree
        run: |
          set -euo pipefail
          python3 scripts/generate-manifest.py --check
