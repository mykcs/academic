name: Validate Manifest

# Companion to scripts/generate-manifest.py.
# Fails the build if meta/manifest.json is out of sync with the
# working tree (i.e. there are tracked files not in the manifest,
# or manifest entries pointing to files that no longer exist).
# Detects drift like ACAD-P0-003 (14 stale `dest` entries).

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate manifest matches working tree
        run: |
          set -euo pipefail
          python3 scripts/generate-manifest.py --check
